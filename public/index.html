<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHive</title>
    <link rel="stylesheet" href="css/style.css">
</head>

</head>

<body>
    <div id="pageTop">
        <header>
        <h1>StreamHive</h1>
        <p id="logo">Dit is een placeholder voor het logo</p>
        </header>
    </div>
    <button id="Register">Register</button>
    <button id="Login">Login</button>
    
        <div class="Login_form">
            <form id="LoginForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                <input type="submit" value="Login">
            </form>
        </div>
        <div class="Register_form">
            <form id="RegisterForm">
                <label for="new_username">Username:</label>
                <input type="text" id="new_username" name="new_username" required><br><br>
                <label for="new_email">Email:</label>
                <input type="email" id="new_email" name="new_email" required><br><br>
                <label for="new_password">Password:</label>
                <input type="password" id="new_password" name="new_password" required><br><br>
                <input type="submit" value="Register">
            </form>

    </div>

    <div id="videoSection">
        <section class="VideoRecommendation">
            <p>Hier komen videos in een grid te staan</p>
        </section>
    </div>

    <div id="pageBottom">
        <footer>
            <p>&copy; 2026 StreamHive VideoPlatform. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
