<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHive</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
</head>

<body>
    <div id="pageTop">
        <header>
        <h1>StreamHive</h1>
        <p id="logo">Dit is een placeholder voor het logo</p>
        <button id="loginButton" type="submit">Login</button>
        <button id="registerButton" type="submit">Register</button>
        </header>
    </div>
    <div id="loginModal" class="Modal">
            <form id="LoginForm">
                <label for="username">Username:</label>
                <input type="text" id="username" name="username" required><br><br>
                <label for="password">Password:</label>
                <input type="password" id="password" name="password" required><br><br>
                <input type="submit" value="Login">
                <button id="forgotten password">Forgotten password</button>
            </form>
        </div>
    </div>
    <div id="registerModal" class="Modal">
            <form id="RegisterForm">
                <label for="new_username">Username:</label>
                <input type="text" id="new_username" name="new_username" required><br><br>
                <label for="new_email">Email:</label>
                <input type="email" id="new_email" name="new_email" required><br><br>
                <label for="new_password">Password:</label>
                <input type="password" id="new_password" name="new_password" required><br><br>
                <input type="submit" value="Register">
            </form>
        </div>
    </div>

    <div id="videoSection">
        <section class="VideoRecommendation">
            <!-- functioneren als placeholders, met link naar database in de maak -->
            <div class="video-card">Video 1</div>
            <div class="video-card">Video 2</div>
            <div class="video-card">Video 3</div>
            <div class="video-card">Video 4</div>
            <div class="video-card">Video 5</div>
            <div class="video-card">Video 6</div>
        </section>
    </div>


    <div id="pageBottom">
        <footer>
            <p>&copy; 2026 StreamHive VideoPlatform. All rights reserved.</p>
        </footer>
    </div>
</body>
</html>
